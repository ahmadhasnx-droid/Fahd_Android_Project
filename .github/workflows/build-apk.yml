name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Project Structure
      run: |
        mkdir -p app/src/main/java/com/fahd/aistudio
        mkdir -p app/src/main/res/layout

        echo 'rootProject.name = "Fahd_Android_Project"' > settings.gradle.kts
        echo 'include(":app")' >> settings.gradle.kts

        echo 'plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.20" apply false }' > build.gradle.kts

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.fahd.aistudio"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.fahd.aistudio"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
        }
        EOF

        mv -f *.kt app/src/main/java/com/fahd/aistudio/ 2>/dev/null || true
        mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv -f activity_main.xml app/src/main/res/layout/ 2>/dev/null || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle (No Cache)
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

